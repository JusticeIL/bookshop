# Render's free tier spins the service down after ~15 minutes of inactivity,
# which would give reviewers a ~50s cold start. This workflow pings the health
# endpoint every 10 minutes so the API stays warm during the evaluation window.
#
# Setup: repo Settings -> Secrets and variables -> Actions -> Variables ->
#        add BACKEND_URL = https://<your-service>.onrender.com
name: keep-warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          if [ -z "${{ vars.BACKEND_URL }}" ]; then
            echo "BACKEND_URL repository variable is not set - skipping."
            exit 0
          fi
          curl -fsS --max-time 60 "${{ vars.BACKEND_URL }}/api/health" && echo " - warm ✓"
