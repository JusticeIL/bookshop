spring:
  application:
    name: bookshop-api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/bookshop}
    username: ${DATABASE_USER:bookshop}
    password: ${DATABASE_PASSWORD:bookshop}

  jpa:
    hibernate:
      ddl-auto: validate # schema is owned by Flyway, never by Hibernate
    open-in-view: false

  flyway:
    enabled: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework # trust X-Forwarded-* headers behind Render's proxy

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  jwt:
    # HS256 signing key. MUST be overridden with a long random value in production.
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:10080} # 7 days: covers the whole review window
  oauth:
    # Leave blank to disable a provider; the frontend discovers enabled providers
    # via GET /api/auth/providers and only renders the corresponding buttons.
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    facebook:
      client-id: ${FACEBOOK_CLIENT_ID:}
      client-secret: ${FACEBOOK_CLIENT_SECRET:}

logging:
  level:
    org.springframework.security: INFO
