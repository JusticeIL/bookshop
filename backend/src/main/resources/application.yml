spring:
  application:
    name: bookshop-api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/bookshop}
    username: ${DATABASE_USER:bookshop}
    password: ${DATABASE_PASSWORD:bookshop}

  jpa:
    hibernate:
      ddl-auto: validate # schema is owned by Flyway, never by Hibernate
    open-in-view: false

  flyway:
    enabled: true

  cache:
    type: redis

  servlet:
    multipart:
      enabled: false # the API accepts no file uploads

  data:
    redis:
      # Catalog read-cache. If Redis is unreachable the app degrades gracefully
      # and serves straight from PostgreSQL (see CacheConfig's error handler).
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 1500ms

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework # trust X-Forwarded-* headers behind Render's proxy
  error:
    # Never leak internals to clients; failures are logged server-side instead.
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
  max-http-request-header-size: 16KB
  tomcat:
    max-swallow-size: 2MB
    max-http-form-post-size: 256KB
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false} # set true in production (HTTPS)
        same-site: lax

app:
  # Drives the CORS allow-list and the registered OAuth2 redirect URI.
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  # "iss" claim stamped into issued access tokens.
  issuer-url: ${ISSUER_URL:http://localhost:8080}

logging:
  level:
    org.springframework.security: INFO
