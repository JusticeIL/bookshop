# Render Blueprint - deploys the backend as a free Docker web service.
# Database is hosted on Neon (free serverless Postgres); set DATABASE_* below.
services:
  - type: web
    name: bookshop-api
    runtime: docker
    plan: free
    rootDir: backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false # jdbc:postgresql://<neon-host>/<db>?sslmode=require
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false # https://<your-app>.vercel.app
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_CLIENT_ID
        sync: false
      - key: FACEBOOK_CLIENT_SECRET
        sync: false
