# Render Blueprint - deploys the backend as a free Docker web service.
# Database is hosted on Neon (free serverless Postgres); set DATABASE_* below.
services:
  - type: web
    name: bookshop-api
    runtime: docker
    plan: free
    rootDir: backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false # jdbc:postgresql://<neon-host>/<db>?sslmode=require
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false # https://<your-app>.vercel.app
      - key: ISSUER_URL
        sync: false # https://<this-service>.onrender.com
      - key: COOKIE_SECURE
        value: "true"
      - key: REDIS_URL
        sync: false # optional - e.g. an Upstash/Render Key Value URL; app degrades gracefully without it
