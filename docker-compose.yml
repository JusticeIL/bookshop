# Local development - no Maven installation required.
#
#   docker compose up --build      -> PostgreSQL + Redis + backend API on http://localhost:8080
#   cd frontend && npm run dev     -> SPA on http://localhost:5173
#
# The api service builds the jar inside Docker (multi-stage build in
# backend/Dockerfile), so the only local prerequisites are Docker Desktop and Node.
# If you prefer running the backend directly (mvn spring-boot:run), start only
# the database:  docker compose up -d postgres
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bookshop
      POSTGRES_USER: bookshop
      POSTGRES_PASSWORD: bookshop
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bookshop -d bookshop']
      interval: 3s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 15

  api:
    build: ./backend
    ports:
      - '8080:8080'
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/bookshop
      DATABASE_USER: bookshop
      DATABASE_PASSWORD: bookshop
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
